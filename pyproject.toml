[project]
name = "zamba-sat"
version = "0.1.0"
description = "Congo Basin deforestation detection — data generation and labeling pipeline for AI-in-Space hackathon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "tenacity>=9.0.0",
    "tqdm>=4.66.0",
    "python-dateutil>=2.9.0",
    "pillow>=10.3.0",
]

[project.optional-dependencies]
hf = [
    "datasets>=2.20.0",
    "huggingface-hub>=0.24.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zamba_sat"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
